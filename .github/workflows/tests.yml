name: Unit and business acceptance tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflows:
    name: xUnit + PostgreSQL business flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workflow_engine
          POSTGRES_PASSWORD: workflow_engine
          POSTGRES_DB: workflow_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow_engine -d workflow_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__WorkflowDatabase: "Host=127.0.0.1;Port=5432;Database=workflow_engine;Username=workflow_engine;Password=workflow_engine"
      WORKFLOW_TEST_URL: http://127.0.0.1:5195
      Integrations__AllowedHosts: localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore unit test project
        run: dotnet restore tests/BusinessWorkflowEngine.Tests/BusinessWorkflowEngine.Tests.csproj

      - name: Run xUnit contract and validator tests
        run: dotnet test tests/BusinessWorkflowEngine.Tests/BusinessWorkflowEngine.Tests.csproj --no-restore -c Release --logger "console;verbosity=normal"

      - name: Start API and run business scenarios against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          API_DLL="src/server/BusinessWorkflowEngine.Api/bin/Release/net10.0/BusinessWorkflowEngine.Api.dll"
          start_api() {
            dotnet "$API_DLL" --urls http://127.0.0.1:5195 > /tmp/workflow-api.log 2>&1 &
            PID=$!
            for attempt in $(seq 1 100); do
              if curl -fsS http://127.0.0.1:5195/readyz > /dev/null 2>&1; then
                return 0
              fi
              if ! kill -0 "$PID" 2>/dev/null; then
                cat /tmp/workflow-api.log
                return 1
              fi
              sleep 0.3
            done
            cat /tmp/workflow-api.log
            echo "API did not become ready" >&2
            return 1
          }
          # Loopback-only TLS endpoint. Trust this disposable test certificate on the runner.
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" \
            -keyout /tmp/mock-https.key -out /tmp/mock-https.crt > /dev/null 2>&1
          sudo cp /tmp/mock-https.crt /usr/local/share/ca-certificates/workflow-mock-https.crt
          sudo update-ca-certificates > /dev/null
          # Linux runners require elevated privileges to listen on port 443.
          sudo -n python3 tests/business/mock_https.py /tmp/mock-https.crt /tmp/mock-https.key > /tmp/mock-https.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$PID" "$MOCK_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 https://localhost/health > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$MOCK_PID" 2>/dev/null; then
              cat /tmp/mock-https.log
              exit 1
            fi
            sleep 0.3
          done
          curl -fsS --max-time 3 https://localhost/health
          start_api
          python3 -m unittest discover -s tests/business -p 'test_*.py' -v

          # Restart the actual ASP.NET Core process. State is retained in PostgreSQL.
          python3 tests/business/test_workflows.py prepare-restart /tmp/pending-work.json
          kill "$PID"
          wait "$PID" || true
          start_api
          python3 tests/business/test_workflows.py verify-restart /tmp/pending-work.json

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-log
          path: |
            /tmp/workflow-api.log
            /tmp/mock-https.log
          if-no-files-found: ignore
