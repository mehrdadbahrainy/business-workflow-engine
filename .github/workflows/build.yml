name: Build application and self-host images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build application and self-host images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/business-workflow-engine-web/package-lock.json

      - name: Restore .NET packages
        run: dotnet restore BusinessWorkflowEngine.sln

      - name: Build API
        run: dotnet build BusinessWorkflowEngine.sln --configuration Release --no-restore

      - name: Install web packages
        working-directory: src/web/business-workflow-engine-web
        run: npm ci

      - name: Build web app
        working-directory: src/web/business-workflow-engine-web
        run: npm run build

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.example -f compose.production.yaml config --quiet

      - name: Build production Compose images
        run: docker compose --parallel 1 --env-file .env.example -f compose.production.yaml build
