name: workflow-engine-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflow_engine}
      POSTGRES_USER: ${POSTGRES_USER:-workflow_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - workflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__WorkflowDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-workflow_engine};Username=${POSTGRES_USER:-workflow_engine};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Authentication__Authority: ${OIDC_AUTHORITY:?Set OIDC_AUTHORITY in .env}
      Authentication__Audience: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE in .env}
      Authentication__RoleClaimType: ${OIDC_ROLE_CLAIM:-role}
      Workflow__AdminRole: ${WORKFLOW_ADMIN_ROLE:-workflow-admin}
      Integrations__AllowedHosts: ${INTEGRATION_ALLOWED_HOSTS:-}
      Integrations__EncryptionKey: ${INTEGRATION_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: src/web/business-workflow-engine-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  workflow-data:
