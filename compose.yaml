services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workflow_engine
      POSTGRES_USER: workflow_engine
      POSTGRES_PASSWORD: workflow_engine
    ports:
      - "5432:5432"
    volumes:
      - workflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_engine -d workflow_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  workflow-postgres:
